name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Database khusus CI, dibuat baru setiap run (versi sama dengan lokal).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_library_test?schema=public
      # Nilai khusus CI untuk menandatangani token uji; bukan secret aplikasi.
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # postinstall menjalankan `prisma generate`.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit --incremental false -p tsconfig.json

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts" "prisma/**/*.ts"

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed categories
        run: npm run db:seed

      - name: E2E tests
        run: npm run test:e2e
